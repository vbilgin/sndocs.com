[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sndocs"
version = "0.1.0"
description = "Fetch, normalize, and build a local ServiceNowDocs site with MkDocs."
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "markdown-it-py>=3",
    "PyYAML>=6",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    # Direct: the rendering engine `sndocs.engine_check` re-validates against and
    # the `pymdownx` bundle `mkdocs.yml` declares (see ADR 0001). Installed
    # transitively by mkdocs-material too, but pinned here as first-class deps.
    "Markdown>=3.7",
    "pymdown-extensions>=10",
    "pagefind[extended]>=1.5",
    # Optional `sndocs build --minify` post-render pass (issue #32): re-emits the
    # rendered site's HTML smaller. The `sndocs.minify` module owns the one
    # conservative option set; `sndocs.minify_check` (#33) imports it from there.
    "minify-html>=0.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
sndocs = "sndocs.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
