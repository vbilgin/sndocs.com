[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sndocs"
dynamic = ["version"]
description = "Fetch, normalize, and build a local ServiceNowDocs site with MkDocs."
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "markdown-it-py>=3",
    "PyYAML>=6",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    # Direct: the rendering engine `sndocs.engine_check` re-validates against and
    # the `pymdownx` bundle `mkdocs.yml` declares (see ADR 0001). Installed
    # transitively by mkdocs-material too, but pinned here as first-class deps.
    "Markdown>=3.7",
    "pymdown-extensions>=10",
    "pagefind[extended]>=1.5",
    # Optional `sndocs build --minify` post-render pass (issue #32): re-emits the
    # rendered site's HTML smaller. The `sndocs.minify` module owns the one
    # conservative option set; `sndocs.minify_check` (#33) imports it from there.
    "minify-html>=0.16",
    # The shared CLI output layer (issue #46, parent #45): progress bars,
    # spinners, non-terminal/NO_COLOR detection, styled diagnostics, and
    # formatted tracebacks in one library. Only `sndocs.reporter` imports it —
    # see ADR 0004.
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    # Test/verification only: `sndocs.minify_check` (#33) parses each page's
    # before/after HTML with lxml to diff DOM structure. Not a runtime dep —
    # `sndocs build --minify` never imports it.
    "lxml>=5",
]

[project.scripts]
sndocs = "sndocs.cli:cli"

[tool.setuptools.dynamic]
version = { attr = "sndocs.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
