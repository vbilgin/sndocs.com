name: Publish latest documentation release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sndocs-cloudflare-production
  cancel-in-progress: false

env:
  R2_BUCKET: sndocs-production
  R2_ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
  AWS_DEFAULT_REGION: auto
  AWS_REQUEST_CHECKSUM_CALCULATION: when_supported
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_supported

jobs:
  test-and-plan:
    name: Test and plan
    runs-on: ubuntu-latest
    environment: preview
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    outputs:
      action: ${{ steps.plan.outputs.action }}
      changed: ${{ steps.plan.outputs.changed }}
      latest: ${{ steps.plan.outputs.latest }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      pipeline_fingerprint: ${{ steps.plan.outputs.pipeline_fingerprint }}
      artifact_id: ${{ steps.plan.outputs.artifact_id }}
      content_prefix: ${{ steps.plan.outputs.content_prefix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps .
          npm ci --prefix worker
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Test pipeline and Worker
        run: |
          pytest
          npm test --prefix worker
          npm run check --prefix worker
      - name: Discover latest upstream family
        run: |
          mkdir -p state
          sndocs discover --json > state/discovery.json
      - name: Read active release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName > state/releases.json
          if jq -e 'any(.tagName == "site-artifact")' state/releases.json >/dev/null
          then
            gh release view site-artifact --json assets > state/release-assets.json
            if jq -e 'any(.assets[].name == "release-manifest.json")' state/release-assets.json >/dev/null
            then
              gh release download site-artifact \
                --pattern release-manifest.json \
                --dir state
            fi
          fi
          if test -f state/release-manifest.json
          then
            mv state/release-manifest.json state/release-manifest.github.json
            release_id=$(jq -r .release_id state/release-manifest.github.json)
            aws s3 cp \
              "s3://${{ env.R2_BUCKET }}/releases/${release_id}.json" \
              state/release-manifest.json \
              --endpoint-url '${{ env.R2_ENDPOINT }}'
            cmp state/release-manifest.github.json state/release-manifest.json
          fi
      - name: Plan latest release
        id: plan
        run: |
          if test -f state/release-manifest.json
          then
            python -m sndocs.deployment_cli plan \
              --discovery state/discovery.json \
              --active-release state/release-manifest.json \
              --output state/deployment-plan.json
          else
            python -m sndocs.deployment_cli plan \
              --discovery state/discovery.json \
              --output state/deployment-plan.json
          fi
      - name: Record plan
        run: |
          {
            echo "## Deployment plan"
            echo
            jq -r '"- Action: `\(.action)`\n- Latest: `\(.latest)`\n- Reason: \(.reason)"' state/deployment-plan.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: deployment-state
          path: state
          if-no-files-found: error
          retention-days: 7

  build-latest:
    name: Build latest
    needs: test-and-plan
    if: needs.test-and-plan.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: preview
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pipeline
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps .
      - name: Build and strictly validate latest family
        run: |
          python scripts/run_with_disk_limit.py \
            --limit-gib 12 \
            --output handoff/disk-usage.json \
            -- sndocs build \
              --output site \
              --family '${{ needs.test-and-plan.outputs.latest }}'
          sndocs validate --site site
      - name: Inventory and package family recovery
        run: |
          mkdir -p handoff/site-root handoff/recovery/assets
          python -m sndocs.deployment_cli inventory \
            --site site \
            --family '${{ needs.test-and-plan.outputs.latest }}' \
            --source-sha '${{ needs.test-and-plan.outputs.source_sha }}' \
            --pipeline-fingerprint '${{ needs.test-and-plan.outputs.pipeline_fingerprint }}' \
            --output handoff/family-inventory.json
          python -m sndocs.deployment_cli package \
            --source 'site/${{ needs.test-and-plan.outputs.latest }}' \
            --archive 'handoff/recovery/assets/sndocs-${{ needs.test-and-plan.outputs.latest }}.tar.gz' \
            --parts-dir handoff/recovery/assets \
            --metadata handoff/family-recovery.json
          jq \
            --arg prefix 'recovery/families/${{ needs.test-and-plan.outputs.latest }}/${{ needs.test-and-plan.outputs.artifact_id }}' \
            --slurpfile archive handoff/family-recovery.json \
            '. + {recovery: {prefix: $prefix, archive: $archive[0]}}' \
            handoff/family-inventory.json > handoff/family-inventory.with-recovery.json
          mv handoff/family-inventory.with-recovery.json handoff/family-inventory.json
          cp site/index.html site/versions.json site/build-manifest.json \
            site/link-report.json site/SERVICENOW-LICENSE.txt handoff/site-root/
      - name: Upload immutable family tree
        run: |
          aws s3api list-objects-v2 \
            --bucket '${{ env.R2_BUCKET }}' \
            --prefix '${{ needs.test-and-plan.outputs.content_prefix }}/' \
            --endpoint-url '${{ env.R2_ENDPOINT }}' > handoff/remote-family.json
          if test "$(jq '(.Contents // []) | length' handoff/remote-family.json)" -eq 0
          then
            aws s3 cp \
              'site/${{ needs.test-and-plan.outputs.latest }}' \
              's3://${{ env.R2_BUCKET }}/${{ needs.test-and-plan.outputs.content_prefix }}/' \
              --recursive \
              --endpoint-url '${{ env.R2_ENDPOINT }}'
            aws s3api list-objects-v2 \
              --bucket '${{ env.R2_BUCKET }}' \
              --prefix '${{ needs.test-and-plan.outputs.content_prefix }}/' \
              --endpoint-url '${{ env.R2_ENDPOINT }}' > handoff/remote-family.json
          fi
          python -m sndocs.deployment_cli verify-family-upload \
            --inventory handoff/family-inventory.json \
            --remote-list handoff/remote-family.json
          aws s3 cp \
            handoff/family-inventory.json \
            's3://${{ env.R2_BUCKET }}/inventories/${{ needs.test-and-plan.outputs.latest }}/${{ needs.test-and-plan.outputs.artifact_id }}.json' \
            --content-type application/json \
            --endpoint-url '${{ env.R2_ENDPOINT }}'
      - name: Upload family recovery assets
        run: |
          aws s3 cp \
            handoff/recovery/assets \
            's3://${{ env.R2_BUCKET }}/recovery/families/${{ needs.test-and-plan.outputs.latest }}/${{ needs.test-and-plan.outputs.artifact_id }}/' \
            --recursive \
            --endpoint-url '${{ env.R2_ENDPOINT }}'
          aws s3 cp \
            handoff/family-recovery.json \
            's3://${{ env.R2_BUCKET }}/recovery/families/${{ needs.test-and-plan.outputs.latest }}/${{ needs.test-and-plan.outputs.artifact_id }}/metadata.json' \
            --content-type application/json \
            --endpoint-url '${{ env.R2_ENDPOINT }}'
      - name: Report runner disk use
        run: |
          {
            echo "## Latest-family build"
            echo
            jq -r '"- Peak additional disk: `\(.peak_consumed_gib) GiB`\n- Effective safety limit: `\((.limit_bytes / 1073741824 * 1000 | round) / 1000) GiB`\n- Reserved free space: `2 GiB`"' handoff/disk-usage.json
            jq -r '"- Family objects: `\(.object_count)`\n- Family bytes: `\(.total_bytes)`\n- Tree digest: `\(.tree_sha256)`"' handoff/family-inventory.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: latest-family-handoff
          path: |
            handoff/site-root
            handoff/family-inventory.json
            handoff/family-recovery.json
            handoff/disk-usage.json
          if-no-files-found: error
          retention-days: 7

  assemble-candidate:
    name: Assemble candidate
    needs: [test-and-plan, build-latest]
    runs-on: ubuntu-latest
    environment: preview
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    outputs:
      release_id: ${{ steps.assemble.outputs.release_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps .
      - uses: actions/download-artifact@v8
        with:
          name: deployment-state
          path: state
      - uses: actions/download-artifact@v8
        with:
          name: latest-family-handoff
          path: handoff
      - name: Download retained root metadata
        if: hashFiles('state/release-manifest.json') != ''
        run: |
          mkdir -p active-root
          root_prefix=$(jq -r .root_prefix state/release-manifest.json)
          for name in index.html versions.json build-manifest.json link-report.json SERVICENOW-LICENSE.txt
          do
            aws s3 cp \
              "s3://${{ env.R2_BUCKET }}/${root_prefix}/${name}" \
              "active-root/${name}" \
              --endpoint-url '${{ env.R2_ENDPOINT }}'
          done
      - name: Assemble and validate release
        id: assemble
        run: |
          if test -f state/release-manifest.json
          then
            python -m sndocs.deployment_cli assemble \
              --site handoff/site-root \
              --inventory handoff/family-inventory.json \
              --active-release state/release-manifest.json \
              --active-root active-root \
              --output-root candidate-root \
              --output-manifest candidate/release-manifest.json
          else
            python -m sndocs.deployment_cli assemble \
              --site handoff/site-root \
              --inventory handoff/family-inventory.json \
              --output-root candidate-root \
              --output-manifest candidate/release-manifest.json
          fi
          python -m sndocs.deployment_cli validate \
            --manifest candidate/release-manifest.json \
            --root candidate-root
      - name: Package root recovery
        run: |
          mkdir -p candidate/recovery/assets
          python -m sndocs.deployment_cli package \
            --source candidate-root \
            --archive candidate/recovery/assets/sndocs-root.tar.gz \
            --parts-dir candidate/recovery/assets \
            --metadata candidate/root-recovery.json
      - name: Upload and verify candidate root
        run: |
          release_id='${{ steps.assemble.outputs.release_id }}'
          root_prefix=$(jq -r .root_prefix candidate/release-manifest.json)
          aws s3api list-objects-v2 \
            --bucket '${{ env.R2_BUCKET }}' \
            --prefix "${root_prefix}/" \
            --endpoint-url '${{ env.R2_ENDPOINT }}' > candidate/remote-root.json
          if test "$(jq '(.Contents // []) | length' candidate/remote-root.json)" -eq 0
          then
            aws s3 cp \
              candidate-root \
              "s3://${{ env.R2_BUCKET }}/${root_prefix}/" \
              --recursive \
              --endpoint-url '${{ env.R2_ENDPOINT }}'
            aws s3api list-objects-v2 \
              --bucket '${{ env.R2_BUCKET }}' \
              --prefix "${root_prefix}/" \
              --endpoint-url '${{ env.R2_ENDPOINT }}' > candidate/remote-root.json
          fi
          jq .root candidate/release-manifest.json > candidate/root-inventory.json
          python -m sndocs.deployment_cli verify-tree-upload \
            --inventory candidate/root-inventory.json \
            --prefix "${root_prefix}" \
            --remote-list candidate/remote-root.json
          aws s3 cp \
            candidate/recovery/assets \
            "s3://${{ env.R2_BUCKET }}/recovery/releases/${release_id}/" \
            --recursive \
            --endpoint-url '${{ env.R2_ENDPOINT }}'
          aws s3 cp \
            candidate/root-recovery.json \
            "s3://${{ env.R2_BUCKET }}/recovery/releases/${release_id}/metadata.json" \
            --content-type application/json \
            --endpoint-url '${{ env.R2_ENDPOINT }}'
      - name: Publish candidate metadata and preview pointer
        run: |
          release_id='${{ steps.assemble.outputs.release_id }}'
          aws s3 cp \
            candidate/release-manifest.json \
            "s3://${{ env.R2_BUCKET }}/releases/${release_id}.json" \
            --content-type application/json \
            --endpoint-url '${{ env.R2_ENDPOINT }}'
          aws s3 cp \
            "s3://${{ env.R2_BUCKET }}/releases/${release_id}.json" \
            candidate/remote-release-manifest.json \
            --endpoint-url '${{ env.R2_ENDPOINT }}'
          cmp candidate/release-manifest.json candidate/remote-release-manifest.json
          jq -n --arg release_id "${release_id}" \
            '{schema_version: 1, release_id: $release_id}' > candidate/preview.json
          aws s3 cp \
            candidate/preview.json \
            's3://${{ env.R2_BUCKET }}/pointers/preview.json' \
            --content-type application/json \
            --cache-control no-store \
            --endpoint-url '${{ env.R2_ENDPOINT }}'
      - name: Record candidate
        run: |
          {
            echo "## Candidate release"
            echo
            jq -r '"- Release: `\(.release_id)`\n- Latest: `\(.latest)`\n- Public families: `\(.families | length)`"' candidate/release-manifest.json
            echo "- Preview: https://preview.sndocs.com/"
            echo
            echo "### Manual preview approval required"
            echo
            echo "Open the preview, check navigation and a representative page, run a Pagefind search, and confirm the preview release and no-index headers before approving production."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-release
          path: |
            candidate/release-manifest.json
            candidate/root-recovery.json
          if-no-files-found: error
          retention-days: 7

  promote-production:
    name: Approve and promote production
    needs: [assemble-candidate]
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: candidate-release
          path: candidate
      - run: npm ci --prefix worker
      - name: Deploy approved Worker version at 100 percent
        working-directory: worker
        run: |
          npx wrangler deploy \
            --env production \
            --var DEPLOYMENT_MODE:production \
            --var RELEASE_ID:'${{ needs.assemble-candidate.outputs.release_id }}' \
            --message 'sndocs release ${{ needs.assemble-candidate.outputs.release_id }}'
      - name: Smoke production and roll back on failure
        run: |
          if ! python scripts/verify_deployment.py \
            --base-url https://sndocs.com \
            --release candidate/release-manifest.json
          then
            cd worker
            npx wrangler rollback --env production --yes
            exit 1
          fi
      - name: Record promotion
        run: |
          {
            echo "## Production promotion"
            echo
            echo "- Deployed release \`${{ needs.assemble-candidate.outputs.release_id }}\` at 100% traffic."
            echo "- Immediate production smoke checks passed."
          } >> "$GITHUB_STEP_SUMMARY"

  publish-recovery:
    name: Publish recovery assets
    needs: [test-and-plan, assemble-candidate, promote-production]
    runs-on: ubuntu-latest
    environment: preview
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: candidate-release
          path: candidate
      - name: Download recovery assets from R2
        run: |
          mkdir -p release-assets/family release-assets/root
          family='${{ needs.test-and-plan.outputs.latest }}'
          artifact_id='${{ needs.test-and-plan.outputs.artifact_id }}'
          release_id='${{ needs.assemble-candidate.outputs.release_id }}'
          aws s3 cp \
            "s3://${{ env.R2_BUCKET }}/recovery/families/${family}/${artifact_id}/" \
            release-assets/family \
            --recursive \
            --endpoint-url '${{ env.R2_ENDPOINT }}'
          aws s3 cp \
            "s3://${{ env.R2_BUCKET }}/recovery/releases/${release_id}/" \
            release-assets/root \
            --recursive \
            --endpoint-url '${{ env.R2_ENDPOINT }}'
          mv release-assets/family/metadata.json candidate/family-recovery.json
          mv release-assets/root/metadata.json candidate/root-recovery.json
      - name: Build reconstruction metadata and checksums
        run: |
          jq -n \
            --slurpfile release candidate/release-manifest.json \
            --slurpfile root candidate/root-recovery.json \
            '{
              schema_version: 1,
              release_id: $release[0].release_id,
              latest: $release[0].latest,
              root: $root[0],
              families: ($release[0].families | map_values(.recovery.archive))
            }' > candidate/reconstruction.json
          for directory in release-assets/family release-assets/root
          do
            (
              cd "$directory"
              sha256sum *
            )
          done > candidate/recovery-assets.sha256
          cp candidate/release-manifest.json release-assets/release-manifest.json
          cp candidate/reconstruction.json release-assets/reconstruction.json
          cp candidate/recovery-assets.sha256 release-assets/recovery-assets.sha256
      - name: Update rolling GitHub Release without replacing archived families
        run: |
          gh release view site-artifact >/dev/null 2>&1 || \
            gh release create site-artifact \
              --title "Latest sndocs.com recovery artifacts" \
              --notes "Rolling recovery metadata and immutable per-family archives for sndocs.com."
          family='${{ needs.test-and-plan.outputs.latest }}'
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/site-artifact" \
            --jq '.assets[].name' |
            while read -r asset
            do
              case "$asset" in
                "sndocs-${family}.tar.gz"|"sndocs-${family}.tar.gz.part-"*)
                  gh release delete-asset site-artifact "$asset" --yes
                  ;;
              esac
            done
          gh release upload site-artifact release-assets/family/*
          gh release upload site-artifact release-assets/root/* --clobber
          gh release upload site-artifact \
            release-assets/reconstruction.json \
            release-assets/recovery-assets.sha256 \
            --clobber
          gh release upload site-artifact \
            release-assets/release-manifest.json \
            --clobber
      - name: Prove reconstruction metadata
        run: |
          jq -e \
            '.release_id == "${{ needs.assemble-candidate.outputs.release_id }}" and
             (.families | length) > 0 and
             (.root.parts | length) > 0' \
            candidate/reconstruction.json

  cleanup:
    name: Guarded cleanup
    needs:
      [test-and-plan, assemble-candidate, promote-production, publish-recovery]
    runs-on: ubuntu-latest
    environment: preview
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps .
      - uses: actions/download-artifact@v8
        with:
          name: deployment-state
          path: state
      - uses: actions/download-artifact@v8
        with:
          name: candidate-release
          path: candidate
      - name: Produce guarded deletion plan
        run: |
          aws s3api list-objects-v2 \
            --bucket '${{ env.R2_BUCKET }}' \
            --endpoint-url '${{ env.R2_ENDPOINT }}' > cleanup-objects.json
          if test -f state/release-manifest.json
          then
            python -m sndocs.deployment_cli cleanup-plan \
              --objects cleanup-objects.json \
              --active-release candidate/release-manifest.json \
              --rollback-release state/release-manifest.json \
              --public-release candidate/release-manifest.json \
              --public-release state/release-manifest.json \
              --output cleanup-plan.json
          else
            python -m sndocs.deployment_cli cleanup-plan \
              --objects cleanup-objects.json \
              --active-release candidate/release-manifest.json \
              --public-release candidate/release-manifest.json \
              --output cleanup-plan.json
          fi
          python -m sndocs.deployment_cli cleanup-batches \
            --plan cleanup-plan.json \
            --destination cleanup-batches
      - name: Apply plan only after a rollback release exists
        if: hashFiles('state/release-manifest.json') != ''
        run: |
          for batch in cleanup-batches/*.json
          do
            test -e "$batch" || continue
            aws s3api delete-objects \
              --bucket '${{ env.R2_BUCKET }}' \
              --delete "file://${batch}" \
              --endpoint-url '${{ env.R2_ENDPOINT }}'
          done
      - name: Report cleanup and storage
        run: |
          aws s3api list-objects-v2 \
            --bucket '${{ env.R2_BUCKET }}' \
            --endpoint-url '${{ env.R2_ENDPOINT }}' \
            --query '{objects:length(Contents),bytes:sum(Contents[].Size)}' \
            > cleanup-storage.json
          {
            echo "## Guarded cleanup"
            echo
            jq -r '"- Planned deletions: `\(.delete_count)` objects / `\(.delete_bytes)` bytes\n- Plan digest: `\(.plan_sha256)`"' cleanup-plan.json
            jq -r '"- Resulting storage: `\(.objects)` objects / `\(.bytes)` bytes"' cleanup-storage.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: cleanup-evidence
          path: |
            cleanup-plan.json
            cleanup-storage.json
          if-no-files-found: error
          retention-days: 30
