site_name: sndocs
site_description: >-
  An independent, unendorsed static mirror of the ServiceNow product
  documentation for the Australia release family, built from the public
  ServiceNow/ServiceNowDocs Markdown corpus.
site_url: https://sndocs.com/
# Points Material's built-in repo link (and client-side star count) at the
# sndocs source. `edit_uri: ""` suppresses the per-page "edit" pencil: pages
# are generated from the normalized corpus, not editable in this repo.
repo_url: https://github.com/vbilgin/sndocs.com
repo_name: sndocs.com
edit_uri: ""
# Plain-text fallback only. The real, linked attribution is rendered on every
# page by overrides/partials/copyright.html (Material's footer copyright
# partial); this string is what shows if that partial is ever bypassed.
copyright: >-
  Documentation content (c) ServiceNow, Inc., licensed under Apache 2.0. sndocs
  is an independent project, not affiliated with or endorsed by ServiceNow, Inc.
docs_dir: .sndocs/normalized
site_dir: .sndocs/site
exclude_docs: |
  normalization-report.json
  normalization-manifest.json
plugins: []
# Markdown rendering engine (Python-Markdown + pymdownx). Deliberately kept close
# to the CommonMark + GFM-tables baseline the normalizer validates its
# "safe to normalize" render-equivalence against (markdown-it-py, commonmark
# preset + `table`). Re-validated against this bundle in issue #14 — see
# docs/adr/0001-rendering-engine-revalidation.md and `sndocs.engine_check`.
#
#   - tables .............. corpus is full of GFM pipe tables; the normalizer also
#                           emits them when converting simple HTML tables.
#   - toc (permalink) ..... heading anchors for in-page navigation.
#   - pymdownx.superfences  replaces the stock `fenced_code`: the corpus has many
#                           unlabelled / tightly-surrounded ``` fences (and the
#                           normalizer's EOF fence closure adds bare ``` fences)
#                           that `fenced_code` leaves as literal text in a <p>.
#   - pymdownx.highlight .. documented superfences pairing; guess_lang off so an
#                           unlabelled fence stays a plain <pre><code>.
#
# Intentionally NOT enabled: md_in_html (raw HTML must stay opaque passthrough,
# matching markdown-it's `html:true` and the normalizer's "leave complex tables
# as raw HTML" contract), and the aggressive inline-syntax extensions
# (tilde/caret/mark/smartsymbols/magiclink/emoji) — near-zero corpus usage, and
# they would widen the parse surface the normalizer's guarantees rest on.
markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight:
      guess_lang: false
theme:
  name: material
  font: false
  custom_dir: overrides
  # Paired light/dark schemes. `media: (prefers-color-scheme: ...)` makes the OS
  # setting the default on first visit; each entry's `toggle` renders the manual
  # switch in the header that overrides (and persists) that choice. The actual
  # five-colour palette (Classic Crimson / Majorelle Blue / Pumpkin Spice /
  # Carbon Black / Parchment) is applied over these schemes by the inline
  # <style> block in overrides/main.html — see docs/adr/0003.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    # Load-bearing, not cosmetic. `nav:` is computed from the whole ~50k-page
    # `australia` corpus (see src/sndocs/build.py); without `navigation.prune`
    # Material renders that entire tree into every page's sidebar — an O(n^2)
    # blow-up that stops a full `sndocs build` from ever finishing. `prune`
    # renders only each page's visible nav slice (ancestors, siblings, direct
    # children) and leaves the mirrored structure and `index.md` landing pages
    # intact. Measurements and rejected alternatives: ADR 0001, "Follow-up:
    # finding 4"; issue #25.
    - navigation.prune
